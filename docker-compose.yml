      context: ./es-consumer
      dockerfile: Dockerfile
    container_name: es-consumer
    depends_on:
      kafka:
        condition: service_healthy
      stream-aggregator:
        condition: service_started
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_PREDICTIONS_TOPIC=ml-predictions
      - KAFKA_GROUP_ID=es-indexer-group
      
      # Elasticsearch Config (Lấy từ .env của file 2)
      - ES_HOSTS=${ELASTIC_HOST}
      - ES_USERNAME=${ELASTIC_USERNAME}
      - ES_PASSWORD=${ELASTIC_PASSWORD}
      - ES_INDEX=ml-nids-alerts
      
      - BATCH_SIZE=1000
      - FLUSH_INTERVAL=10
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
