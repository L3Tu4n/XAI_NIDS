services:
  # ============================================
  # KAFKA BROKER (KRaft Mode - Apache Kafka 4.1.0)
  # Host IP: 192.168.63.150
  # ============================================
  kafka:
    image: apache/kafka:4.1.0
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092"  # Internal listener + Host access
      - "9093:9093"  # Controller
      - "9094:9094"  # External listener for Zeek VM (.129)
    environment:
      # KRaft configuration
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      
      # Listeners configuration
      KAFKA_LISTENERS: 'INTERNAL://0.0.0.0:9092,CONTROLLER://kafka:9093,EXTERNAL://0.0.0.0:9094'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka:9092,EXTERNAL://192.168.63.150:9094'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      
      # Topic settings
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      
      # Performance tuning
      KAFKA_NUM_NETWORK_THREADS: 8
      KAFKA_NUM_IO_THREADS: 8
      KAFKA_SOCKET_SEND_BUFFER_BYTES: 102400
      KAFKA_SOCKET_RECEIVE_BUFFER_BYTES: 102400
      KAFKA_LOG_RETENTION_HOURS: 168
      
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
    
    user: root
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    networks:
      - ml-nids-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ============================================
  # KAFKA UI (Monitoring)
  # ============================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: ml-nids-kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: 'true'
    networks:
      - ml-nids-network

  # ============================================
  # ML API SERVICE
  # ============================================
  ml-api:
    build:
      context: ./ml-api
      dockerfile: Dockerfile
    container_name: ml-api
    ports:
      - "5000:5000"
    volumes:
      - ./models:/opt/ml-nids/models:ro
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - WORKERS=4
    restart: unless-stopped
    networks:
      - ml-nids-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================
  # STREAM AGGREGATOR
  # Reads from: zeek-logs (từ Filebeat)
  # Writes to: ml-predictions (sau khi aggregate + ML)
  # ============================================
  stream-aggregator:
    build:
      context: ./stream-aggregator
      dockerfile: Dockerfile
    container_name: stream-aggregator
    depends_on:
      kafka:
        condition: service_healthy
      ml-api:
        condition: service_healthy
    volumes:
      - ./models:/opt/ml-nids/models:ro
    environment:
      # Kafka configuration
      - ENCODER_PATH=/opt/ml-nids/models/feature_schema.pkl
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      
      # Topic names - CORRECTED
      - INPUT_TOPIC=zeek-conn              # Input từ Filebeat (tên topic chuẩn)
      - OUTPUT_TOPIC=ml-predictions   
      - XAI_QUEUE_TOPIC=xai-queue     # Output sau aggregate + ML
      - CONSUMER_GROUP=stream-aggregator-group
      
      # Window configuration
      - WINDOW_SIZE_SECONDS=10             # 10 second window
      - FLUSH_INTERVAL_SECONDS=5           # Check every 5s
      - MAX_BUFFER_SIZE=1000               # Force flush at 1000 flows
      
      # ML API
      - ML_API_URL=http://ml-api:5000
      
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - ml-nids-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # ============================================
  # ELASTICSEARCH CONSUMER
  # Reads from: ml-predictions (sau Stream Aggregator)
  # Writes to: Elasticsearch (192.168.63.134)
  # ============================================
  es-consumer:
    build:
      context: ./es-consumer
      dockerfile: Dockerfile
    container_name: es-consumer
    depends_on:
      kafka:
        condition: service_healthy
      stream-aggregator:
        condition: service_started
    environment:
      # Kafka configuration
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_PREDICTIONS_TOPIC=ml-predictions  # CORRECTED: Đọc từ ml-predictions
      - KAFKA_GROUP_ID=es-indexer-group
      
      # Elasticsearch configuration (External server)
      - ES_HOSTS=https://192.168.63.134:9200
      - ES_INDEX=ml-nids-alerts
      - ES_USERNAME=elastic
      - ES_PASSWORD=-B8Ph8fVTlnMPP-K7ffw
      
      # Processing configuration
      - BATCH_SIZE=1000
      - FLUSH_INTERVAL=10
      
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
    
    restart: unless-stopped
    networks:
      - ml-nids-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # ============================================
  # XAI + LLM Sevice
  # Reads from: ml-predictions (sau Stream Aggregator)
  # Writes to: Elasticsearch (192.168.63.134)
  # ============================================

  xai_llm_service:
    build: ./xai_llm_service
    container_name: xai_llm_service
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./models:/opt/ml-nids/models:ro
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - INPUT_TOPIC=xai-queue
      - CONSUMER_GROUP=xai-worker-group
      - MODEL_DIR=/opt/ml-nids/models
      - ES_HOSTS=https://192.168.63.134:9200
      - ES_INDEX=ml-nids-alerts
      - ES_USERNAME=elastic
      - ES_PASSWORD=-B8Ph8fVTlnMPP-K7ffw
      - LLM_PROVIDER=gemini
      - GEMINI_API_KEY=AIzaSyCCPbIZKK9hR2xyWnGa1t1xbW0y0ZnzZUE
      - XAI_DEDUP_HOURS=1
      - LOG_LEVEL=INFO
    restart: unless-stopped
    networks:
      - ml-nids-network
volumes:
  kafka-data:
    driver: local

networks:
  ml-nids-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16