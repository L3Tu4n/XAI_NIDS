<ossec_config>
  <localfile>
    <log_format>json</log_format>
    <location>/usr/local/zeek/logs/current/notice.log</location>
    <frequency>1</frequency>
  </localfile>

  <localfile>
    <log_format>json</log_format>
    <location>/var/log/suricata/eve.json</location>
    <frequency>1</frequency>
  </localfile>

  <command>
    <name>simple-block</name>
    <executable>simple-block.sh</executable>
    <timeout_allowed>no</timeout_allowed>
  </command>

  <active-response>
    <disabled>no</disabled>
    <command>simple-block</command>
    <location>all</location>
    <rules_id>250001,250002</rules_id>
  </active-response>

  <active-response>
    <disabled>no</disabled>
    <command>simple-cleanup</command>
    <location>all</location>
    <rules_id>220002</rules_id>
  </active-response>
</ossec_config>
