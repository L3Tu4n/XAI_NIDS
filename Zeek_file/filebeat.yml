# ✅ FIXED CONFIGURATION FOR AGGREGATOR V3.0 (All logs to zeek-raw)

filebeat.inputs:
  
  # --- INPUT 1: CONN.LOG ---
  - type: log
    enabled: true
    paths:
      - /usr/local/zeek/logs/current/conn.log
    exclude_lines: ['^#']
    
    # JSON Parsing
    json.keys_under_root: true
    json.add_error_key: true
    json.overwrite_keys: true
    json.message_key: message
    processors:
      - add_fields:
          target: ''
          fields:
            log_type: conn
            source_host: 192.168.63.129
      # Xóa bớt rác để nhẹ Kafka
      - drop_fields:
          fields: ["log", "input", "agent", "ecs", "host", "@metadata"]
          ignore_missing: true

  # --- INPUT 2: HTTP.LOG ---
  - type: log
    enabled: true
    paths:
      - /usr/local/zeek/logs/current/http.log
    exclude_lines: ['^#']
    
    json.keys_under_root: true
    json.add_error_key: true
    json.overwrite_keys: true
    json.message_key: message
    processors:
      - add_fields:
          target: ''
          fields:
            log_type: http
            source_host: 192.168.63.129
      - drop_fields:
          fields: ["log", "input", "agent", "ecs", "host", "@metadata"]
          ignore_missing: true

  # --- INPUT 3: DNS.LOG ---
  - type: log
    enabled: true
    paths:
      - /usr/local/zeek/logs/current/dns.log
    exclude_lines: ['^#']
    
    json.keys_under_root: true
    json.add_error_key: true
    json.overwrite_keys: true
    json.message_key: message
    processors:
      - add_fields:
          target: ''
          fields:
            log_type: dns
            source_host: 192.168.63.129
      - drop_fields:
          fields: ["log", "input", "agent", "ecs", "host", "@metadata"]
          ignore_missing: true

# ==========================================
# OUTPUT: GỬI TẤT CẢ VÀO 1 TOPIC DUY NHẤT
# ==========================================
output.kafka:
  enabled: true
  # IP của máy chứa Kafka (ML Server)
  hosts: ["192.168.63.150:9094"] 
  compression: snappy
  codec.json:
    pretty: false
    
  # ⚠️ QUAN TRỌNG: Tất cả đổ về đây để Aggregator xử lý
  topic: "zeek-raw"
